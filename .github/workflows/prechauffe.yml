# Audit de couverture des données match — la CHAUFFE n'est plus ici.
#
# Depuis le 05/09/2026 la chauffe (/api/prechauffe/) tourne sur Vercel Cron
# (vercel.json, */30 * * * *). GitHub Actions ne garantit pas ses schedules :
# mesuré sur la nuit du 04 au 05/09, un cron déclaré toutes les 30 min a
# tourné à 07:00, 02:07, 23:44, 21:57, 19:43, 17:16 — des trous de 2 à 5 h.
# Avec des TTL de 30 min sur les cotes et les compos, tout expirait entre deux
# passages : 10 % de complétude au réveil. Vercel Cron tient la minute (la
# preuve : /api/push-goals/ y tourne toutes les minutes sans rater).
#
# Ce workflow ne fait plus que l'AUDIT + l'ALERTE. Son retard n'a plus
# d'importance : il constate un état que Vercel maintient. S'il trouve des
# trous, c'est un vrai problème, pas un cron en retard — et le job rouge
# envoie un mail.

name: Audit couverture donnees match

on:
  schedule:
    - cron: '15,45 * * * *'
  workflow_dispatch:

concurrency:
  group: audit-couverture
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Auditer la couverture
        run: |
          echo "Audit de la couverture des donnees…"
          REP=$(curl -sS -m 90 "https://ninjascores.com/api/couverture/")
          echo "$REP" | python3 -m json.tool || echo "$REP"
          SANTE=$(echo "$REP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('sante','inconnu'))")
          if [ "$SANTE" = "degrade" ]; then
            echo "::error::Couverture degradee — des matchs de ligues prioritaires n'ont pas leurs donnees alors que la chauffe Vercel devrait tourner toutes les 30 min. Voir le detail ci-dessus."
            exit 1
          fi
          echo "Couverture OK ($SANTE)."
