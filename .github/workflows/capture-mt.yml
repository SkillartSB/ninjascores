# Capture des stats de mi-temps, toutes les 5 minutes.
#
# Le plan Vercel (Hobby) limite les crons a 1/jour. Le depot etant PUBLIC,
# GitHub Actions offre des minutes illimitees : on s'en sert comme horloge.
# Le job se contente d'appeler l'endpoint /api/capture-mt (qui tourne sur
# Vercel avec la cle API et Redis) — aucun secret necessaire ici.
#
# GitHub peut retarder un cron de quelques minutes sous charge ; la pause
# durant ~15 min, une frequence de 5 min la rattrape largement.

name: Capture stats mi-temps

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: capture-mt
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Declencher la capture
        run: |
          echo "Appel de l'endpoint de capture…"
          curl -sS -m 40 "https://ninjascores.com/api/capture-mt/" -w "\nHTTP %{http_code}\n"
