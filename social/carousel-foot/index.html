<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>NinjaScores — Carrousel Foot</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="theme.css">
<style>
/* ═══════════════════════════════════════════════════════════════
   Mise en page propre au carrousel. Le socle commun (décor, marque,
   titrage, animations) est dans theme.css ; les données du jour
   dans data.js.
   ═══════════════════════════════════════════════════════════════ */

/* ═══ SLIDE 1 — liste des matchs ═══ */
.cover-title{margin-top:70px;font-size:200px}
.cover-sub{margin-top:.13em;font-size:104px;display:flex;gap:.26em;align-items:baseline}
.cover-sub .hollow{-webkit-text-stroke:2.2px rgba(255,255,255,.5)}

.fixtures{margin-top:70px;border-top:1px solid var(--hair)}
.fx{display:flex;align-items:center;gap:28px;height:95px;border-bottom:1px solid var(--hair);position:relative}
.fx::after{content:'';position:absolute;left:0;bottom:-1px;width:0;height:1px;background:var(--violet-hi)}
.fx .h{font:700 25px/1 'JBMono',monospace;letter-spacing:.04em;color:var(--amber);width:92px;flex:none}
.fx .duo{display:flex;flex:none;width:96px}
.fx .duo img{width:57px;height:57px;object-fit:contain;filter:drop-shadow(0 3px 8px rgba(0,0,0,.6))}
.fx .duo img:last-child{margin-left:-18px}
.fx .n{font:900 39px/1 'Archivo';font-stretch:104%;letter-spacing:-.005em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx .lg{margin-left:auto;font:500 18px/1 'JBMono',monospace;letter-spacing:.15em;
  color:rgba(255,255,255,.46);text-transform:uppercase;white-space:nowrap}

.swipe{margin-top:auto;display:flex;align-items:center;justify-content:flex-end;gap:16px;padding:44px 0}
.swipe span{font:700 23px/1 'JBMono',monospace;letter-spacing:.44em;color:rgba(255,255,255,.82)}
.swipe i{display:block;width:9px;height:9px;border-top:2px solid rgba(255,255,255,.5);
  border-right:2px solid rgba(255,255,255,.5);transform:rotate(45deg)}
.swipe .arrow{width:52px;height:2px;background:#fff;position:relative;margin-left:6px}
.swipe .arrow::after{content:'';position:absolute;right:-1px;top:-6px;width:14px;height:14px;
  border-top:2px solid #fff;border-right:2px solid #fff;transform:rotate(45deg)}

/* ═══ SLIDES 2-6 — match ═══ */
.mhead{margin-top:54px;display:flex;align-items:flex-start;justify-content:space-between}
.league{display:flex;align-items:center;gap:22px}
.league .badge{width:78px;height:78px;border-radius:20px;flex:none;display:grid;place-items:center;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 10px 30px rgba(0,0,0,.5)}
.league .badge img{width:52px;height:52px;object-fit:contain}
.league .t1{font:900 30px/1.05 'Archivo';font-stretch:108%;letter-spacing:.05em;text-transform:uppercase}
.league .t2{margin-top:9px;font:500 18px/1 'JBMono',monospace;letter-spacing:.20em;
  color:rgba(255,255,255,.5);text-transform:uppercase}
.kick{text-align:right}
.kick .v{font:900 62px/1 'Archivo';font-stretch:115%;letter-spacing:-.02em;
  background:linear-gradient(180deg,#fff,#D9CEF7);-webkit-background-clip:text;background-clip:text;color:transparent}
.kick .l{margin-top:10px;font:600 17px/1 'JBMono',monospace;letter-spacing:.24em;color:rgba(255,255,255,.5)}

.duel{flex:1;display:flex;align-items:center;justify-content:center;gap:0;position:relative;margin-top:6px}
.side{width:44%;display:flex;flex-direction:column;align-items:center}
.disc{position:relative;width:290px;height:290px;display:grid;place-items:center}
.disc .ring{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 132deg, transparent 0deg,
    color-mix(in srgb,var(--c) 92%,transparent) 62deg, transparent 156deg,
    rgba(255,255,255,.05) 190deg, rgba(255,255,255,.30) 244deg, transparent 320deg);
  -webkit-mask:radial-gradient(circle, transparent 0 48.1%, #000 48.4%);
  mask:radial-gradient(circle, transparent 0 48.1%, #000 48.4%);opacity:.95}
.disc .plate{position:absolute;inset:14px;border-radius:50%;
  background:radial-gradient(circle at 50% 34%, rgba(255,255,255,.10), rgba(255,255,255,.02) 58%, rgba(0,0,0,.35) 100%);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:inset 0 2px 40px rgba(255,255,255,.06), 0 26px 70px rgba(0,0,0,.55)}
.disc.lit .plate{background:radial-gradient(circle at 50% 30%, #FFFFFF 0%, #F2EFFA 56%, #D8D2E9 100%);
  border-color:rgba(255,255,255,.55);
  box-shadow:inset 0 -18px 40px rgba(90,70,140,.18), 0 26px 70px rgba(0,0,0,.6)}
.disc.lit img{filter:drop-shadow(0 10px 18px rgba(40,20,70,.35))}
.league .badge.lit{background:linear-gradient(180deg,#FFFFFF,#EDE9F7);border-color:rgba(255,255,255,.5)}
.disc .halo{position:absolute;inset:-44px;border-radius:50%;filter:blur(38px);opacity:.7;
  background:radial-gradient(circle, color-mix(in srgb,var(--c) 62%,transparent) 0%, transparent 62%)}
.disc .ticks{position:absolute;inset:-16px;border-radius:50%;opacity:.5}
.disc img{position:relative;width:170px;height:200px;object-fit:contain;
  filter:drop-shadow(0 16px 26px rgba(0,0,0,.75)) drop-shadow(0 0 30px color-mix(in srgb,var(--c) 45%,transparent))}
.side .nm{margin-top:36px;font:900 54px/1 'Archivo';font-stretch:112%;letter-spacing:-.015em;
  text-transform:uppercase;text-align:center}
.side .meta{margin-top:14px;font:600 16px/1 'JBMono',monospace;letter-spacing:.24em;color:rgba(255,255,255,.42)}

.vs{width:12%;display:grid;place-items:center;position:relative;align-self:center;margin-top:-58px}
.vs .chip{padding:11px 17px;border-radius:10px;background:rgba(4,3,10,.86);
  border:1px solid rgba(255,255,255,.16);font:800 21px/1 'JBMono',monospace;letter-spacing:.24em;
  box-shadow:0 10px 34px rgba(0,0,0,.7)}
.vs .bar{position:absolute;width:2px;height:330px;
  background:linear-gradient(180deg,transparent 4%,rgba(255,255,255,.40) 50%,transparent 96%);
  transform:rotate(15deg)}

/* bande stats */
.stats{display:flex;align-items:center;gap:0;margin-bottom:22px;
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.stats .cell{flex:1;padding:22px 0;display:flex;flex-direction:column;gap:12px}
.stats .cell + .cell{border-left:1px solid var(--hair);padding-left:32px}
.stats .k{font:600 15px/1 'JBMono',monospace;letter-spacing:.22em;color:rgba(255,255,255,.44);text-transform:uppercase}
.stats .v{font:900 38px/1 'Archivo';font-stretch:110%;letter-spacing:.01em;white-space:nowrap;
  display:flex;align-items:center;gap:14px}
.stats .v em{font-style:normal;color:var(--amber)}
.stats .v u{text-decoration:none;font-size:.62em;color:rgba(255,255,255,.44);margin-left:-6px}
.stats .s{font:500 16px/1 'JBMono',monospace;letter-spacing:.11em;color:rgba(255,255,255,.46);
  text-transform:uppercase;white-space:nowrap}
.stats .dots{display:inline-flex;gap:5px;margin-left:10px;vertical-align:middle}
.stats .dots i{width:9px;height:9px;border-radius:50%;background:var(--amber);display:block}
.stats .dots i.off{background:rgba(255,255,255,.18)}

/* bande prono */
.tip{position:relative;margin:0 calc(var(--pad) * -1);
  padding:44px var(--pad) 46px;display:flex;align-items:flex-end;justify-content:space-between;gap:40px;
  background:linear-gradient(104deg,#5B21B6 0%,#7C3AED 46%,#8B5CF6 100%);
  clip-path:polygon(0 26px, 100% 0, 100% 100%, 0 100%);overflow:hidden}
.tip::before{content:'';position:absolute;inset:0;opacity:.5;
  background:repeating-linear-gradient(104deg, rgba(255,255,255,.075) 0 2px, transparent 2px 30px)}
.tip::after{content:'';position:absolute;right:-8%;top:-60%;width:52%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.22),transparent 62%)}
.tip .l{position:relative;min-width:0}
.tip .kicker{display:flex;align-items:center;gap:14px;font:700 19px/1 'JBMono',monospace;
  letter-spacing:.36em;color:rgba(255,255,255,.9);text-transform:uppercase}
.tip .kicker b{color:var(--amber-hi);font-size:15px}
.tip .txt{margin-top:22px;font:900 66px/.96 'Archivo';font-stretch:112%;letter-spacing:-.02em;
  text-transform:uppercase;text-shadow:0 10px 34px rgba(28,8,64,.5)}
.tip .r{position:relative;text-align:right;flex:none}
.tip .r .k{font:600 18px/1 'JBMono',monospace;letter-spacing:.34em;color:rgba(255,255,255,.82)}
.tip .r .odd{margin-top:12px;font:900 84px/1 'Archivo';font-stretch:118%;letter-spacing:-.03em;color:var(--amber);
  text-shadow:0 8px 30px rgba(0,0,0,.35)}
.tip .r .src{margin-top:10px;font:500 15px/1 'JBMono',monospace;letter-spacing:.16em;color:rgba(255,255,255,.66)}

/* ═══ SLIDE 7 — CTA ═══ */
.cta-wrap{display:flex;flex:1;gap:28px;align-items:center;margin-top:52px}
.cta-l{width:60%;flex:none}
.cta-title{font-size:150px}
.cta-sub{margin-top:.12em;font-size:100px;display:flex;gap:.24em;align-items:baseline}
.search{margin-top:58px;display:flex;align-items:center;gap:18px;padding:24px 26px;border-radius:20px;
  background:rgba(255,255,255,.085);border:1px solid rgba(255,255,255,.16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 18px 44px rgba(0,0,0,.45);backdrop-filter:blur(6px)}
.search .q{font:700 27px/1 'Archivo';font-stretch:104%;letter-spacing:-.01em;white-space:nowrap}
.search .caret{width:2px;height:30px;background:var(--violet-hi);margin-left:-8px}
.search .x{margin-left:34px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.2);
  display:grid;place-items:center;font:700 17px/1 'Archivo';color:#1b1030}
.stores{margin-top:26px;display:flex;flex-direction:column;gap:18px}
.store{display:flex;align-items:center;gap:20px;padding:18px 30px;border-radius:18px;background:#fff;color:#08060F;
  box-shadow:0 18px 44px rgba(0,0,0,.42)}
.store svg{width:36px;height:36px;flex:none}
.store .s1{font:600 15px/1 'JBMono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#4B4458}
.store .s2{margin-top:6px;font:900 31px/1 'Archivo';font-stretch:106%;letter-spacing:-.01em}
.freegrid{margin-top:30px;display:flex;align-items:center;gap:16px;
  font:700 20px/1 'JBMono',monospace;letter-spacing:.26em;color:rgba(255,255,255,.86);text-transform:uppercase}
.freegrid .dot{width:13px;height:13px;border-radius:50%;background:#22C55E;box-shadow:0 0 18px #22C55E}
.site{margin-top:20px;font:600 26px/1 'JBMono',monospace;letter-spacing:.10em;color:rgba(255,255,255,.92)}

/* téléphone */
.phone{position:relative;flex:1;height:92%;border-radius:58px;padding:13px;
  background:linear-gradient(150deg,#2A2740,#0C0A18 46%,#221E36);
  box-shadow:0 50px 110px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.10), inset 0 1px 0 rgba(255,255,255,.2);
  transform:rotate(-3.4deg) translateY(10px)}
.phone .screen{position:relative;height:100%;border-radius:46px;overflow:hidden;background:#F6F4FB;color:#160E27}
.phone .notch{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:104px;height:28px;
  border-radius:20px;background:#0B0914;z-index:3}
.phone .chips{display:flex;gap:8px;padding:56px 18px 12px}
.phone .chips b{font:700 12px/1 'Jakarta',sans-serif;padding:9px 12px;border-radius:999px;
  background:#EDE7FB;color:#4A2E8F;white-space:nowrap}
.phone .chips b.on{background:#7C3AED;color:#fff}
.phone .card{margin:0 14px 10px;padding:12px 13px;border-radius:16px;background:#fff;
  box-shadow:0 4px 14px rgba(30,10,70,.09)}
.phone .card .lg{display:flex;align-items:center;gap:8px;font:800 12px/1 'Jakarta',sans-serif;color:#3C2A64}
.phone .card .lg img{width:17px;height:17px;object-fit:contain}
.phone .card .mt{margin-top:8px;font:600 11px/1 'Jakarta',sans-serif;color:#8A82A0}
.phone .card .row{margin-top:7px;display:flex;align-items:center;gap:8px}
.phone .card .pr{font:800 14px/1.15 'Jakarta',sans-serif;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phone .card .pc{font:800 12px/1 'Jakarta',sans-serif;padding:6px 8px;border-radius:8px;background:#FFF1D6;color:#9A6B00}
.phone .card .oc{font:800 12px/1 'Jakarta',sans-serif;padding:6px 9px;border-radius:8px;background:#7C3AED;color:#fff}
.phone .more{margin:6px 14px 0;padding:13px;border-radius:14px;border:1px dashed #D9D1F0;
  text-align:center;font:700 11px/1 'Jakarta',sans-serif;color:#6E6396}
.phone .tabs{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;
  padding:13px 8px 24px;background:rgba(255,255,255,.94);border-top:1px solid #EDE8F8;backdrop-filter:blur(6px)}
.phone .tabs b{display:flex;flex-direction:column;align-items:center;gap:6px;
  font:700 9px/1 'Jakarta',sans-serif;color:#A79FBE}
.phone .tabs b.on{color:#7C3AED}
.phone .tabs i{width:15px;height:15px;border-radius:5px;background:currentColor;opacity:.85;display:block}
.phone .glare{position:absolute;inset:0;z-index:4;pointer-events:none;
  background:linear-gradient(122deg, rgba(255,255,255,.22) 0%, transparent 30%, transparent 72%, rgba(255,255,255,.10) 100%)}

/* ── Variante 9:16 (TikTok / Stories) ─────────────────────────
   Même grille, mais on redonne de l'ampleur là où la hauteur s'ajoute. */
:root[data-fmt="story"] .bg .glow-top{top:-34%;width:172%}
:root[data-fmt="story"] .bg .floor{
  background:linear-gradient(180deg,transparent 48%,rgba(5,4,11,.6) 80%,#05040B 100%)}
:root[data-fmt="story"] .cover-title{margin-top:120px}
:root[data-fmt="story"] .fixtures{margin-top:130px}
:root[data-fmt="story"] .fx{height:150px}
:root[data-fmt="story"] .fx .n{font-size:42px}
:root[data-fmt="story"] .fx .h{font-size:29px;width:108px}
:root[data-fmt="story"] .fx .duo{width:128px}
:root[data-fmt="story"] .fx .duo img{width:76px;height:76px}
:root[data-fmt="story"] .fx .lg{font-size:21px}
:root[data-fmt="story"] .swipe{padding:80px 0}
:root[data-fmt="story"] .mhead{margin-top:86px}
:root[data-fmt="story"] .disc{width:352px;height:352px}
:root[data-fmt="story"] .disc img{width:206px;height:242px}
:root[data-fmt="story"] .side .nm{margin-top:46px;font-size:64px}
:root[data-fmt="story"] .vs .bar{height:420px}
:root[data-fmt="story"] .stats .cell{padding:34px 0}
:root[data-fmt="story"] .stats{margin-bottom:34px}
:root[data-fmt="story"] .tip{padding:58px var(--pad) 60px}
:root[data-fmt="story"] .tip .txt{font-size:76px}
:root[data-fmt="story"] .tip .r .odd{font-size:96px}
:root[data-fmt="story"] .cta-wrap{margin-top:90px}
:root[data-fmt="story"] .stores{margin-top:40px}
:root[data-fmt="story"] .store{padding:24px 34px}
:root[data-fmt="story"] .search{margin-top:74px;padding:30px 30px}
:root[data-fmt="story"] .phone{height:70%}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="bar">
  <button id="btn-play">▶ Rejouer l'anim</button>
  <button id="btn-ig" class="on">1080×1350 · IG</button>
  <button id="btn-story">1080×1920 · TikTok</button>
  <button id="btn-zoom">Zoom 100%</button>
</div>

<script src="data.js"></script>
<script src="common.js"></script>
<script>
/* Les 7 slides du carrousel. */
const TOTAL = CAROUSEL.matches.length + 2;

FIT.push(['.cover-title', 240, 60], ['.cover-sub', 124, 40],
         ['.cta-title', 190, 50], ['.cta-sub', 118, 40]);

/* ── Slide 1 : la sélection du jour ───────────────────────────── */
function slideCover() {
  const c = CAROUSEL.cover;
  const rows = CAROUSEL.matches.map((m, i) => `
    <div class="fx a-wipe" style="--d:${.62 + i * .09}s">
      <div class="h">${m.time}</div>
      <div class="duo">
        <img src="${m.home.crest}" alt=""><img src="${m.away.crest}" alt="">
      </div>
      <div class="n">${up(m.home.name)} / ${up(m.away.name)}</div>
      <div class="lg">${up(m.league.name)}</div>
    </div>`).join('');

  return `
  <div class="slide" data-i="0">
    ${bg('#7C3AED', '#A855F7')}
    <div class="sweep"></div>
    <div class="inner">
      ${head()}
      <div class="eyebrow a-rise" style="--d:.26s;margin-top:84px">${up(c.eyebrow)}</div>
      <div class="title cover-title a-blur" style="--d:.32s">
        ${echo(c.l1)}
        <span class="solid">${up(c.l1)}</span>
      </div>
      <div class="title cover-sub">
        <span class="solid a-rise" style="--d:.46s">${up(c.l2a)}</span>
        <span class="hollow a-rise" style="--d:.54s">${up(c.l2b)}</span>
      </div>
      <div class="fixtures">${rows}</div>
      <div class="swipe a-rise" style="--d:1.15s">
        <span>${up(c.swipe)}</span><i></i><i></i><i></i><div class="arrow"></div>
      </div>
      ${foot(0, TOTAL)}
    </div>
    <div class="vignette"></div><div class="scan"></div><div class="grain"></div>
  </div>`;
}

/* ── Slides 2 → 6 : un match, un prono ────────────────────────── */
function slideMatch(m, i) {
  const n = i + 1;
  const side = (t, d) => `
    <div class="side">
      <div class="disc${t.plate === 'light' ? ' lit' : ''} a-pop" style="--c:${t.color};--d:${d}s">
        <div class="halo"></div>
        <div class="ticks">
          <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="49" fill="none"
            stroke="rgba(255,255,255,.34)" stroke-width=".5" stroke-dasharray=".6 4.2"/></svg>
        </div>
        <div class="ring"></div><div class="plate"></div>
        <img src="${t.crest}" alt="${t.name}">
      </div>
      <div class="nm a-rise" style="--d:${d + .12}s">${up(t.name)}</div>
    </div>`;

  const dots = Array.from({ length: 10 }, (_, k) =>
    `<i class="${k < m.note ? '' : 'off'}"></i>`).join('');

  return `
  <div class="slide" data-i="${n}">
    ${bg(m.home.color, m.away.color)}
    <div class="sweep"></div>
    <div class="inner">
      ${head()}
      <div class="mhead">
        <div class="league a-rise" style="--d:.24s">
          <div class="badge${m.league.light ? ' lit' : ''}"><img src="${m.league.badge}" alt=""></div>
          <div>
            <div class="t1">${up(m.league.name)}</div>
            <div class="t2">${up(m.league.country)} · PRONO ${pad2(n)}/${pad2(CAROUSEL.matches.length)}</div>
          </div>
        </div>
        <div class="kick a-rise" style="--d:.30s">
          <div class="v">${m.time}</div>
          <div class="l">COUP D'ENVOI</div>
        </div>
      </div>

      <div class="duel">
        ${side(m.home, .38)}
        <div class="vs a-pop" style="--d:.62s">
          <div class="bar"></div><div class="chip">VS</div>
        </div>
        ${side(m.away, .46)}
      </div>

      <div class="stats a-rise" style="--d:.80s">
        <div class="cell">
          <div class="k">Fréquence observée</div>
          <div class="v"><em>${m.freq}</em></div>
          <div class="s">Sur les 10 derniers matchs</div>
        </div>
        <div class="cell">
          <div class="k">Note du ninja</div>
          <div class="v">${m.note}<u>/10</u><span class="dots">${dots}</span></div>
          <div class="s">Indice de confiance</div>
        </div>
      </div>

      <div class="tip a-rise" style="--d:.88s">
        <div class="l">
          <div class="kicker"><b>◆</b> Le prono du ninja</div>
          <div class="txt">${up(m.prono[0])}<br>${up(m.prono[1] || '')}</div>
        </div>
        <div class="r">
          <div class="k">COTE</div>
          <div class="odd">${m.cote}</div>
          <div class="src">INDICATIVE · ${up(m.book)}</div>
        </div>
      </div>
      ${foot(n, TOTAL)}
    </div>
    <div class="vignette"></div><div class="scan"></div><div class="grain"></div>
  </div>`;
}

/* ── Slide 7 : télécharge l'app ───────────────────────────────── */
function slideCta() {
  const c = CAROUSEL.cta, i = TOTAL - 1;
  const cards = CAROUSEL.matches.map(m => `
    <div class="card">
      <div class="lg"><img src="${m.league.badge}" alt="">${m.league.name}</div>
      <div class="mt">${m.home.name} – ${m.away.name}</div>
      <div class="row">
        <div class="pr">${m.prono.join(' ')}</div>
        <div class="pc">${m.freq}</div>
        <div class="oc">${m.cote}</div>
      </div>
    </div>`).join('');

  return `
  <div class="slide" data-i="${i}">
    ${bg('#7C3AED', '#A855F7')}
    <div class="sweep"></div>
    <div class="inner">
      ${head()}
      <div class="eyebrow a-rise" style="--d:.24s;margin-top:60px">${up(c.eyebrow)}</div>
      <div class="cta-wrap">
        <div class="cta-l">
          <div class="title cta-title a-blur" style="--d:.30s">
            ${echo(c.l1)}
            <span class="solid">${up(c.l1)}</span>
          </div>
          <div class="title cta-sub">
            <span class="solid a-rise" style="--d:.42s">${up(c.l2a)}</span>
            <span class="hollow a-rise" style="--d:.50s">${up(c.l2b)}</span>
          </div>
          <div class="search a-rise" style="--d:.62s">
            <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2.4">
              <circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 L21 21" stroke-linecap="round"/>
            </svg>
            <div class="q">${c.search}</div><div class="caret"></div>
            <div class="x">×</div>
          </div>
          <div class="stores">
            <div class="store a-rise" style="--d:.72s">
              <svg viewBox="0 0 24 24" fill="#08060F"><path d="M16.7 12.9c0-2.2 1.8-3.3 1.9-3.4-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.7.8-3.3.8-.7 0-1.7-.8-2.8-.8-1.5 0-2.8.8-3.6 2.1-1.5 2.6-.4 6.5 1.1 8.6.7 1 1.6 2.2 2.7 2.1 1.1 0 1.5-.7 2.8-.7s1.7.7 2.8.7c1.2 0 1.9-1 2.6-2.1.8-1.2 1.2-2.4 1.2-2.4s-2.2-.9-2.2-3.2zM14.5 5.9c.6-.7 1-1.7.9-2.7-.9 0-2 .6-2.6 1.3-.6.6-1.1 1.7-.9 2.6 1 .1 2-.5 2.6-1.2z"/></svg>
              <div><div class="s1">Télécharger sur</div><div class="s2">App Store</div></div>
            </div>
            <div class="store a-rise" style="--d:.80s">
              <svg viewBox="0 0 24 24">
                <path d="M3.6 2.4c-.3.3-.5.8-.5 1.4v16.4c0 .6.2 1.1.5 1.4l8.7-9.6-8.7-9.6z" fill="#34A853"/>
                <path d="M16.3 15.5 12.3 12l4-3.5 4.2 2.3c.9.5.9 1.9 0 2.4l-4.2 2.3z" fill="#FBBC04"/>
                <path d="M3.6 2.4 16.3 8.5l-4 3.5-8.7-9.6z" fill="#EA4335"/>
                <path d="M3.6 21.6 12.3 12l4 3.5-12.7 6.1z" fill="#4285F4"/>
              </svg>
              <div><div class="s1">Disponible sur</div><div class="s2">Google Play</div></div>
            </div>
          </div>
          <div class="freegrid a-rise" style="--d:.88s"><span class="dot"></span>${up(c.claim)}</div>
          <div class="site a-rise" style="--d:.94s">${c.site}</div>
        </div>

        <div class="phone a-pop" style="--d:.56s">
          <div class="screen">
            <div class="notch"></div>
            <div class="chips"><b class="on">🔥 Top du jour</b><b>🎁 Bonus</b><b>⭐ Ma sélection</b></div>
            ${cards}
            <div class="more">${c.more}</div>
            <div class="tabs">
              <b class="on"><i></i>Pronos</b><b><i></i>Live</b><b><i></i>Classements</b><b><i></i>Transferts</b>
            </div>
          </div>
          <div class="glare"></div>
        </div>
      </div>
      ${foot(i, TOTAL)}
    </div>
    <div class="vignette"></div><div class="scan"></div><div class="grain"></div>
  </div>`;
}

mount({
  slides: [slideCover(), ...CAROUSEL.matches.map(slideMatch), slideCta()],
  label: (i, n) => `Slide ${String(i + 1).padStart(2, '0')} / ${n}`,
  height: 1350,
  formats: true,
});
</script>
</body>
</html>
