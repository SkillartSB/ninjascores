<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #E8E8F0; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }
  #root { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }

  @keyframes shimmer {
    0% { background-position: -400px 0; }
    100% { background-position: 400px 0; }
  }
  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .skeleton {
    background: linear-gradient(90deg, #e0e0ec 25%, #f0f0f8 50%, #e0e0ec 75%);
    background-size: 400px 100%;
    animation: shimmer 1.4s ease-in-out infinite;
    border-radius: 8px;
  }
  .skeleton-dark {
    background: linear-gradient(90deg, #1e2035 25%, #252840 50%, #1e2035 75%);
    background-size: 400px 100%;
    animation: shimmer 1.4s ease-in-out infinite;
    border-radius: 8px;
  }
  .screen-enter { animation: fadeIn 0.28s ease forwards; }
  .detail-enter { animation: slideUp 0.35s cubic-bezier(0.32, 0.72, 0, 1) forwards; }
  .live-dot { animation: pulse 1.5s ease-in-out infinite; }
</style>

  var CACHE = {};
  var PENDING = {};

  // Supprime les suffixes/préfixes FC, AFC, SC, CF, UD, FK, SK ajoutés par Polymarket
  function cleanTeamName(n) {
    if (!n) return n;
    // Suffixes: AFC, FC, SC, CF, UD, FK, SK, BK, IF, GF
    n = n.replace(/\s+(?:A\.?F\.?C\.?|F\.?C\.?|S\.?C\.?|C\.?F\.?|U\.?D\.?|F\.?K\.?|S\.?K\.?|B\.?K\.?|I\.?F\.?|G\.?F\.?)$/i, '');
    // Prefixes: CA, AS, RC, CD, SD, FK, SK, FC
    n = n.replace(/^(?:C\.?A\.?|A\.?S\.?|R\.?C\.?|C\.?D\.?|S\.?D\.?|F\.?K\.?|S\.?K\.?|F\.?C\.?)\s+/i, '');
    return n.trim();
  }
  window.cleanTeamName = cleanTeamName;

  function resolve(name) {
    return NAME_MAP[name] || name;
  }

  // Affichage : applique NAME_MAP puis cleanTeamName
  window.displayTeamName = function(n) {
    if (!n) return n;
    return cleanTeamName(resolve(n));
  };

  function fetchLogo(name) {
    var key = resolve(name);
    if (key in CACHE) return Promise.resolve(CACHE[key]);
    if (key in PENDING) return PENDING[key];

    var clean     = cleanTeamName(name);
    var cleanKey  = resolve(clean);

    // 1. club_logos_metadata (inline, highest priority) — essaie nom brut puis sans FC
    var p = Promise.resolve().then(function() {
      var url = CLUB_LOGOS[name] || CLUB_LOGOS[key]
             || CLUB_LOGOS[clean] || CLUB_LOGOS[cleanKey];
      if (url) { CACHE[key] = url; return url; }

      // 2. Vérifier si on a un logo connu dans LOGOS
      if (key in LOGOS) {
        CACHE[key] = LOGOS[key];
        return LOGOS[key];
      }
      if (cleanKey in LOGOS) {
        CACHE[key] = LOGOS[cleanKey];
        return LOGOS[cleanKey];
      }

      // 3. Essayer l'API TheSportsDB avec nom nettoyé en priorité
      return fetch(
        'https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t=' +
        encodeURIComponent(cleanKey || key)
      )
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var teams = (data && data.teams) || [];
          var result = null;

          if (teams && teams.length > 0) {
            // Chercher une correspondance exacte
            for (var i = 0; i < teams.length; i++) {
              if (teams[i].strTeam && teams[i].strTeam.toLowerCase() === key.toLowerCase()) {
                result = teams[i].strBadge || teams[i].strLogo;
                break;
              }
            }

          }

          CACHE[key] = result || null;
          return result;
        })
        .catch(function(e) {
          CACHE[key] = null;
          return null;
        });
    });

    PENDING[key] = p;
    return p;
  }

  // Composant React – résout le logo puis affiche img ou fallback initiales
  function TeamLogo(props) {
    var name   = props.name   || '';
    var color  = props.color  || '#888';
    var size   = props.size   || 28;
    // Lettre fallback : utilise le nom nettoyé (sans FC/SC/CF)
    var displayName = cleanTeamName(name) || name;
    var letter = props.letter || (displayName[0] || '?');

    var key = resolve(name);
    var initial = (key in CACHE) ? CACHE[key] : undefined;

    var st = React.useState(initial);
    var logoUrl  = st[0];
    var setLogo  = st[1];

    var se = React.useState(false);
    var imgError = se[0];
    var setError = se[1];

    React.useEffect(function() {
      if (key in CACHE) { setLogo(CACHE[key]); return; }
      var alive = true;
      fetchLogo(name).then(function(url) {
        if (alive) setLogo(url);
      });
      return function() { alive = false; };
    }, [key]);

    if (logoUrl && !imgError) {
      return React.createElement('img', {
        src:     logoUrl,
        alt:     name,
        width:   size,
        height:  size,
        style:   {
          width: size, height: size,
          objectFit: 'contain',
          flexShrink: 0,
          display: 'block',
        },
        onError: function() { setError(true); },
      });
    }

    // Fallback : cercle initiales (même style que TeamCircle)
    return React.createElement('div', {
      style: {
        width: size, height: size,
        borderRadius: '50%',
        background:   'linear-gradient(135deg, ' + color + '22, ' + color + '44)',
        border:       '2px solid ' + color + '66',
        display:      'flex',
        alignItems:   'center',
        justifyContent: 'center',
        fontSize:     size * 0.38,
        fontWeight:   700,
        color:        color,
        flexShrink:   0,
      }
    }, letter);
  }

  function fetchTennisComps() {
    return Promise.all([
      fetch('/api/tennis-livescore').then(function(r) { return r.json(); }),
      fetch('/api/tennis-fixtures').then(function(r) { return r.json(); })
    ]).then(function(res) {
      var live = Array.isArray(res[0]) ? res[0] : [];
      var fixtures = Array.isArray(res[1]) ? res[1] : [];
      var liveKeys = {};
      live.forEach(function(m) { liveKeys[m.event_key] = true; });
      var upcoming = fixtures.filter(function(m) { return !liveKeys[m.event_key]; });
      var allMatches = live.concat(upcoming);

      var byTournament = {};
      allMatches.forEach(function(m) {
        var key = m.tournament_name || 'Autre';
        if (!byTournament[key]) byTournament[key] = [];
        byTournament[key].push(m);
      });

      var ORDER = { live: 0, upcoming: 1, ended: 2 };
      return Object.keys(byTournament).map(function(name) {
        return {
          competition: name,
          matches: byTournament[name].map(function(m) {
            var isLive = m.event_live === '1';
            var done = ['Finished', 'Retired', 'Walkover'].indexOf(m.event_status) >= 0;
            return {
              eventId: m.event_key,
              homeTeam: m.event_first_player,
              awayTeam: m.event_second_player,
              status: isLive ? 'live' : (done ? 'ended' : 'upcoming'),
              eventStatus: m.event_status,
              gameResult: m.event_game_result,
              finalResult: m.event_final_result,
              scores: m.scores || [],
              time: m.event_time,
              round: m.tournament_round,
              serve: m.event_serve,
              isTennis: true,
            };
          }).sort(function(a, b) { return (ORDER[a.status] || 1) - (ORDER[b.status] || 1); })
        };
      }).sort(function(a, b) {
        var aL = a.matches.filter(function(m) { return m.status === 'live'; }).length;
        var bL = b.matches.filter(function(m) { return m.status === 'live'; }).length;
        return bL - aL;
      });
    });
  }

  function fmtTime(date) {
    if (!date || !(date instanceof Date) || isNaN(date)) return '';
    return date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Paris' });
  }

  function fmtDate(date) {
    if (!date || !(date instanceof Date) || isNaN(date)) return '';
    var today = new Date();
    var diff = Math.round((date - today) / 86400000);
    if (diff === 0) return 'Aujourd\'hui';
    if (diff === 1) return 'Demain';
    if (diff === -1) return 'Hier';
    return date.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
  }

<script>
(function() {
  var BASE = 'https://api.sofascore.app/api/v1';
  var CACHE = {};

  // Mapping sport app → slug SofaScore
  var SLUG = { hockey: 'ice-hockey', football: 'football', basketball: 'basketball', rugby: 'rugby-union' };

  // Tournois NHL & Ligue Magnus (IDs SofaScore)
  var HOCKEY_IDS = { 17: 'NHL · Playoffs', 716: 'NHL · Playoffs', 19: 'NHL · Playoffs', 1046: 'Ligue Magnus · Finale', 424: 'Ligue Magnus · Finale' };
  var HOCKEY_NAMES = ['nhl', 'ligue magnus', 'liga magnus'];

  // Tournois foot majeurs (IDs SofaScore uniqueTournament)
  var FOOT_IDS = {
    17: { name: 'Premier League', color: '#3D195B', badge: '🏴󠁧󠁢󠁥󠁮󠁧󠁿' },
    8:  { name: 'LaLiga', color: '#EF3340', badge: '🇪🇸' },
    34: { name: 'Ligue 1', color: '#1A3A6A', badge: '🇫🇷' },
    35: { name: 'Bundesliga', color: '#D20515', badge: '🇩🇪' },
    23: { name: 'Serie A', color: '#1B5DB1', badge: '🇮🇹' },
    238: { name: 'Champions League', color: '#001D6C', badge: '🏆' },
    679: { name: 'Europa League', color: '#F77F00', badge: '🟠' },
    7:  { name: 'Premier League', color: '#3D195B', badge: '🏴󠁧󠁢󠁥󠁮󠁧󠁿' },
  };

  // Couleurs équipes connues
  var COLORS = {
    Rangers: '#0038A8', Panthers: '#C8102E', Bruins: '#FFB81C', 'Maple Leafs': '#003E7E',
    Avalanche: '#6F263D', Jets: '#041E42', Oilers: '#FF4C00', Stars: '#006847',
    Lightning: '#002868', Hurricanes: '#CC0000', Wild: '#A6192E', Kings: '#111111',
    Grenoble: '#C8102E', Rouen: '#003082', Bordeaux: '#003082', Amiens: '#E63946',
    Angers: '#002395', Briançon: '#1A1A6E', Gap: '#C8102E',
    Liverpool: '#C8102E', Arsenal: '#EF0107', Chelsea: '#034694', Tottenham: '#132257',
    'Man City': '#6CABDD', 'Man United': '#DA291C', Newcastle: '#241F20', Brighton: '#0057B8',
    'Real Madrid': '#FEBE10', Barcelona: '#A50044', 'Atletico Madrid': '#272E61',
    'Paris Saint-Germain': '#004170', Lyon: '#012035', Marseille: '#009AC7',
    'Bayern Munich': '#DC052D', Dortmund: '#FDE100', Leverkusen: '#E32219',
    Juventus: '#000000', 'Inter Milan': '#010E80', 'AC Milan': '#AC0B37',
  };

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function dateOf(off) {
    var d = new Date(); d.setDate(d.getDate() + off);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function teamColor(name) { return COLORS[name] || '#6B7280'; }
  function shortName(t) {
    if (!t) return '';
    var n = t.shortName || t.name || '';
    // Supprime les préfixes de ligue ajoutés par SofaScore (ex: "AHL: Chicago Wolves" → "Chicago Wolves")
    return n.replace(/^(AHL|KHL|NHL|ECHL|SHL|DEL|LIIGA|AHL):\s*/i, '');
  }
  function mapStatus(ev) {
    var tp = ev.status && ev.status.type;
    if (tp === 'inprogress') return 'live';
    if (tp === 'finished') return 'finished';
    return 'scheduled';
  }
  function getMinute(ev) {
    if (!ev.time) return null;
    return ev.time.played ? Math.round(ev.time.played / 60) : null;
  }

  function fetchEvents(sport, off) {
    var slug = SLUG[sport] || sport;
    var ds = dateOf(off);
    var key = slug + ':' + ds;
    if (CACHE[key]) return CACHE[key];
    var p = fetch(BASE + '/sport/' + slug + '/scheduled-events/' + ds)
      .then(function(r) { return r.json(); })
      .then(function(d) { return d.events || []; })
      .catch(function() { return []; });
    CACHE[key] = p;
    return p;
  }

  function toGroups(events, sport, off) {
    var leagues = {};
    events.forEach(function(ev) {
      var ut = ev.tournament && ev.tournament.uniqueTournament;
      var tid = ut && ut.id;
      var tname = (ut && ut.name) || (ev.tournament && ev.tournament.name) || '';
      var tnl = tname.toLowerCase();

      var leagueName, leagueColor, leagueBadge;

      if (sport === 'hockey') {
        // Filtre NHL + Ligue Magnus
        var isNHL = HOCKEY_IDS[tid] || HOCKEY_NAMES.some(function(n) { return tnl.indexOf(n) !== -1; });
        if (!isNHL) return;
        leagueName = HOCKEY_IDS[tid] || (tnl.indexOf('magnus') !== -1 ? 'Ligue Magnus · Finale' : 'NHL · Playoffs');
        leagueColor = tnl.indexOf('magnus') !== -1 ? '#002395' : '#000000';
        leagueBadge = tnl.indexOf('magnus') !== -1 ? '🇫🇷' : '🇺🇸';
      } else if (sport === 'football') {
        var info = FOOT_IDS[tid];
        if (!info) return;
        leagueName = info.name;
        leagueColor = info.color;
        leagueBadge = info.badge;
      } else {
        leagueName = tname;
        leagueColor = '#888888';
        leagueBadge = '🏒';
      }

      if (!leagues[leagueName]) {
        leagues[leagueName] = { sport: sport, league: leagueName, leagueBadge: leagueBadge, leagueColor: leagueColor, matches: [] };
      }

      var hn = shortName(ev.homeTeam);
      var an = shortName(ev.awayTeam);
      var st = mapStatus(ev);
      var hs = (ev.homeScore && ev.homeScore.current != null) ? ev.homeScore.current : (st === 'scheduled' ? null : 0);
      var as_ = (ev.awayScore && ev.awayScore.current != null) ? ev.awayScore.current : (st === 'scheduled' ? null : 0);

      leagues[leagueName].matches.push({
        id: 'sofa_' + ev.id,
        dayOffset: off,
        homeTeam: hn,
        awayTeam: an,
        homeScore: hs,
        awayScore: as_,
        homeColor: teamColor(hn),
        awayColor: teamColor(an),
        status: st,
        minute: getMinute(ev),
      });
    });
    return Object.values(leagues);
  }

  window.NinjaSofaScore = {
    fetchByOffset: function(sport, off) {
      return fetchEvents(sport, off).then(function(evs) { return toGroups(evs, sport, off); });
    },
  };
})();
</script>

<!-- ── Tennis live backend patch ─────────────────────────────────────────── -->
<script>
(function() {
  var TENNIS_API = '';  // Vercel serverless — même domaine

  // SportsWS score store: slug → wsScore object used by MatchDetailScreen
  var _scoreStore = {};

  // Returns only completed sets (excludes in-progress set for live matches)
  function completedSets(m) {
    var scores = m.scores || [];
    var done   = ['Finished','Retired','Walkover'].indexOf(m.event_status) >= 0;
    if (done) return scores;
    var mm = (m.event_status || '').match(/Set (\d)/);
    if (!mm) return [];
    var currentSetNum = parseInt(mm[1]);
    return scores.filter(function(s) { return parseInt(s.score_set) < currentSetNum; });
  }

  // "1-0" — no comma → list shows "1" / "0" via sc.split('-')
  function buildSetsWon(m) {
    var isLive = m.event_live === '1';
    var done   = ['Finished','Retired','Walkover'].indexOf(m.event_status) >= 0;
    if (!isLive && !done) return null;
    var p1SW = 0, p2SW = 0;
    completedSets(m).forEach(function(s) {
      var f = parseInt(s.score_first) || 0, sec = parseInt(s.score_second) || 0;
      if (f > sec) p1SW++; else if (sec > f) p2SW++;
    });
    return p1SW + '-' + p2SW;
  }

  // "6-3, 3-2" — ALL sets (incl. in-progress) → comma → _tsets → set grid in Stats tab
  function buildAllSetsStr(m) {
    var scores = m.scores || [];
    if (!scores.length) return null;
    return scores.map(function(s) {
      return (parseInt(s.score_first) || 0) + '-' + (parseInt(s.score_second) || 0);
    }).join(', ');
  }

  // "3:2" — game score in the CURRENT set (Flashscore subtitle: "Set 2 · 3:2")
  function buildCurrentSetGameScore(m) {
    if (m.event_live !== '1') return null;
    var mm = (m.event_status || '').match(/Set (\d)/);
    if (!mm) return null;
    var currentSetNum = parseInt(mm[1]);
    var scores = m.scores || [];
    for (var i = 0; i < scores.length; i++) {
      if (parseInt(scores[i].score_set) === currentSetNum) {
        return (parseInt(scores[i].score_first) || 0) + ':' + (parseInt(scores[i].score_second) || 0);
      }
    }
    return '0:0';
  }

  function toPeriodCode(eventStatus) {
    if (!eventStatus) return null;
    var m = eventStatus.match(/Set (\d)/);
    if (m) return 'S' + m[1];
    if (['Finished','Retired','Walkover'].indexOf(eventStatus) >= 0) return 'FT';
    return null;
  }

  function transformMatch(m) {
    var isLive = m.event_live === '1';
    var done   = ['Finished','Retired','Walkover'].indexOf(m.event_status) >= 0;
    var slug   = 'tennis_' + m.event_key;
    var apiScore, wsEntry;

    if (isLive) {
      var setsWon   = buildSetsWon(m);              // "1-0" → header + list
      var gameScore = buildCurrentSetGameScore(m);  // "3:2" → subtitle "Set 2 · 3:2"
      var setMatch  = (m.event_status || '').match(/Set (\d)/);
      var period    = setMatch ? 'Set ' + setMatch[1] : (m.event_status || 'En cours');
      // setsStr = ONLY completed sets → set grid shows no in-progress column
      var compSets  = completedSets(m);
      var setsStr   = compSets.length > 0 ? compSets.map(function(s) {
        return (parseInt(s.score_first) || 0) + '-' + (parseInt(s.score_second) || 0);
      }).join(', ') : null;
      apiScore = setsWon;
      wsEntry  = {
        score:   setsWon,                                // header split('-') → "1" "0"
        setsStr: setsStr,                                // _tsc → _tsets → per-set grid (completed only)
        pbp:     m.pointbypoint || [],                   // point-by-point data for Stats tab
        live:    true,
        period:  period,                                 // "Set 2"
        elapsed: gameScore ? '· ' + gameScore : null,   // "· 3:2"
      };
    } else if (done) {
      // Ended: comma format → _tsc → set grid in Stats/Aperçu tab
      var doneSets = m.scores || [];
      apiScore = doneSets.length > 0 ? doneSets.map(function(s) {
        return (parseInt(s.score_first) || 0) + '-' + (parseInt(s.score_second) || 0);
      }).join(', ') : null;
      // setsStr → _tsc in detail view; score = sets won e.g. "2-0" → header
      var p1W = doneSets.filter(function(s){ return parseInt(s.score_first) > parseInt(s.score_second); }).length;
      var p2W = doneSets.filter(function(s){ return parseInt(s.score_second) > parseInt(s.score_first); }).length;
      wsEntry  = { ended: true, period: 'FT', pbp: m.pointbypoint || [], setsStr: apiScore, score: p1W + '-' + p2W };
    } else {
      apiScore = null;
      wsEntry  = null;
    }

    if (wsEntry) _scoreStore[slug] = wsEntry;

    return {
      homeTeam:  m.tournament_name + ': ' + m.event_first_player + ' vs ' + m.event_second_player,
      awayTeam:  '',
      status:    isLive ? 'live' : (done ? 'ended' : 'upcoming'),
      startDate: new Date(m.event_date + 'T' + (m.event_time||'00:00') + ':00Z'),
      slug:      slug,
      eventId:   m.event_key,
      apiScore:  apiScore,
      apiLive:   isLive,
      apiEnded:  done,
      apiPeriod: toPeriodCode(m.event_status),
      apiPbp:    m.pointbypoint || [],                   // point-by-point passé au match detail
      apiTier:   tournamentPriority(m),                  // 1=GS, 2=M1000, 3=500, 4=250, 5=Challenger, 6=ITF
    };
  }

  // Augment SportsWS.getScore() — never broadcast → list uses m.apiScore directly
  function setupSportsWS() {
    var sws = window.PolymarketService.SportsWS;
    if (sws) {
      var _orig = sws.getScore.bind(sws);
      sws.getScore = function(slug) { return _scoreStore[slug] || _orig(slug); };
    } else {
      var _subs = [];
      window.PolymarketService.SportsWS = {
        connect:    function() {},
        disconnect: function() {},
        subscribe:  function(cb) {
          _subs.push(cb);
          return function() { var i = _subs.indexOf(cb); if (i >= 0) _subs.splice(i, 1); };
        },
        getScore:   function(slug) { return _scoreStore[slug] || null; },
      };
    }
  }

  function tournamentPriority(m) {
    var name = ((m.tournament_name || '') + ' ' + (m.event_type_type || '')).toLowerCase();
    // Grand Slams
    if (/roland|french open|wimbledon|us open|australian open/.test(name)) return 1;
    // Masters 1000 / WTA 1000
    if (/1000|masters(?! cup)|indian wells|miami|monte.carlo|madrid|rome|canada|cincinnati|shanghai|paris|beijing/.test(name)) return 2;
    // ATP/WTA 500
    if (/500|dubai|acapulco|rotterdam|hamburg|washington|tokyo|vienna|basle|basel/.test(name)) return 3;
    // ATP/WTA 250
    if (/250/.test(name)) return 4;
    // Challenger
    if (/challenger/.test(name)) return 5;
    // ITF
    if (/itf/.test(name)) return 6;
    return 4; // default: treat unknown as ATP/WTA 250
  }

  function fetchTennisForPolymarket() {
    var tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
    var tomorrowStr = tomorrow.toISOString().slice(0, 10);
    return Promise.all([
      fetch('/api/tennis-livescore').then(function(r) { return r.json(); }),
      fetch('/api/tennis-fixtures').then(function(r) { return r.json(); }),
      fetch('/api/tennis-fixtures?date=' + tomorrowStr).then(function(r) { return r.json(); }).catch(function() { return []; })
    ]).then(function(res) {
      var live        = Array.isArray(res[0]) ? res[0] : [];
      var fixtures    = Array.isArray(res[1]) ? res[1] : [];
      var fixturesTom = Array.isArray(res[2]) ? res[2] : [];
      var liveKeys = {};
      live.forEach(function(m) { liveKeys[m.event_key] = true; });
      var allFixtures = fixtures.concat(fixturesTom);
      var all = live.concat(allFixtures.filter(function(m) { return !liveKeys[m.event_key]; }));
      // Remove ITF Men & Women (M15, M25, W15, W35, W75…) — trop de bruit
      all = all.filter(function(m) {
        var tt = (m.event_type_type || '').toLowerCase();
        return tt.indexOf('itf') !== 0;
      });

      // Sort by importance: Grand Slams first, then Masters 1000, 500, 250, Challenger, ITF
      // Live matches always before non-live within the same priority tier
      all.sort(function(a, b) {
        var pa = tournamentPriority(a), pb = tournamentPriority(b);
        if (pa !== pb) return pa - pb;
        var aLive = a.event_live === '1' ? 0 : 1;
        var bLive = b.event_live === '1' ? 0 : 1;
        return aLive - bLive;
      });

      var atp = [], wta = [];
      all.forEach(function(m) {
        var t = (m.event_type_type || '').toLowerCase();
        if (t.indexOf('wta') !== -1 || t.indexOf('women') !== -1) wta.push(m);
        else atp.push(m);
      });

      var result = [];
      if (atp.length) result.push({ competition: 'ATP', seriesId: null, matches: atp.map(transformMatch) });
      if (wta.length) result.push({ competition: 'WTA', seriesId: null, matches: wta.map(transformMatch) });
      return result;
    });
  }

  // Expose pour ScheduleScreen — accès direct sans passer par PolymarketService
  window.NinjaTennisAPI = { fetchComps: fetchTennisForPolymarket };

  function patchWhenReady() {
    if (!window.PolymarketService) { setTimeout(patchWhenReady, 100); return; }
    setupSportsWS();
    var _orig = window.PolymarketService.getLivescoreForSport.bind(window.PolymarketService);
    window.PolymarketService.getLivescoreForSport = function(sport) {
      if (sport === 'tennis') return fetchTennisForPolymarket();
      return _orig(sport);
    };
  }

  patchWhenReady();
})();
</script>
